<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>Kona RTL Verification</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark">K</span>
        <span>Kona</span>
      </div>
      <button id="runButton" class="run-button" aria-label="Run lint operation">Run Lint</button>
    </header>
    <main class="workspace">
      <aside class="sidebar">
        <span class="sidebar-label active" aria-current="page">Editor</span>
      </aside>
      <section class="editor-pane">
        <div class="pane-header">
          <span id="fileName">kona.yaml</span>
          <span id="status" class="status">Ready</span>
        </div>
        <textarea id="manifest" spellcheck="false">project_name: counter
top_module: counter
rtl_files:
  - rtl/counter.sv
include_dirs:
  - rtl/include
sim_mode: fast_2state
testbench: tests/test_counter.py
waveform_signals:
  - dut.clk
  - dut.rst_n
  - dut.count
</textarea>
      </section>
      <section class="results-pane">
        <div class="pane-header">
          <span>Diagnostics</span>
          <div class="operation-tabs">
            <button data-operation="lint" class="active" aria-pressed="true">Lint</button>
            <button data-operation="run" aria-pressed="false">Run</button>
            <button data-operation="prove" aria-pressed="false">Prove</button>
          </div>
        </div>
        <div id="results" class="results">
          <p class="muted">Edit the project manifest, then run the selected operation.</p>
        </div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
