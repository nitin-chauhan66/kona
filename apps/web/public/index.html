<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kona — Visual Chip Design & Verification Platform</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20width=%22100%22%20height=%22100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body>
  <!-- Header Bar -->
  <header class="app-header">
    <div class="brand-group">
      <div class="brand-logo">⚡ Kona</div>
      <div class="brand-tag">Visual Silicon Platform</div>
    </div>

    <div class="header-center">
      <div id="templates-picker"></div>
      <div id="drc-status-chip" class="status-chip success">Checking DRC...</div>
    </div>

    <div class="header-actions">
      <div class="action-btn-group">
        <button id="btn-zoom-out" class="icon-btn" title="Zoom Out">-</button>
        <button id="btn-zoom-reset" class="icon-btn" title="Reset View">100%</button>
        <button id="btn-zoom-in" class="icon-btn" title="Zoom In">+</button>
      </div>
      <button id="btn-share-link" class="btn btn-secondary">🔗 Share</button>
      <button id="btn-export-json" class="btn btn-secondary">Export .kona.json</button>
      <button id="btn-export-sv" class="btn btn-primary">Export top.sv</button>
    </div>
  </header>

  <!-- Main Studio Workspace -->
  <main class="app-workspace">
    <!-- Left Sidebar: IP Catalog & Components -->
    <aside class="sidebar-left">
      <div class="sidebar-header">
        <h2>Starter IP Library</h2>
        <span class="subtext">Click to place on canvas</span>
      </div>
      <div id="catalog-items-list" class="catalog-list"></div>
    </aside>

    <!-- Center: Schematic Canvas Viewport -->
    <section class="canvas-viewport">
      <canvas id="schematic-canvas"></canvas>
      <div class="canvas-hint">
        <span>💡 Drag port pins to route wires. Del to remove block. Click & drag to move or pan.</span>
      </div>
    </section>

    <!-- Right Sidebar: Parameter Inspector & DRC -->
    <aside class="sidebar-right">
      <div class="sidebar-tabs">
        <div class="tab-btn active">Inspector</div>
      </div>
      <div id="inspector-content" class="inspector-body"></div>
      
      <!-- Collapsible DRC diagnostics pane at bottom of right sidebar -->
      <div class="drc-panel-container">
        <div class="drc-panel-header">
          <span>DRC Diagnostics</span>
        </div>
        <div id="drc-panel-body" class="drc-panel-body"></div>
      </div>
    </aside>
  </main>

  <!-- Bottom Drawer: Split-Screen RTL Preview & Waveform Viewer -->
  <footer class="app-bottom-drawer">
    <div class="drawer-header">
      <div class="drawer-tabs">
        <button class="drawer-tab active" data-target="rtl">SystemVerilog Preview (top.sv)</button>
        <button class="drawer-tab" data-target="waveform">Local Wasm Simulation & Waveforms</button>
      </div>

      <div class="drawer-actions">
        <button id="btn-copy-sv" class="btn-sm">Copy RTL</button>
        <div class="sim-inline-controls">
          <label>Cycles:</label>
          <input type="number" id="sim-cycles" value="64" min="8" max="512" class="kona-input-sm" />
          <button id="btn-run-sim" class="btn-sm btn-accent">▶ Run Local Wasm Sim</button>
          <span id="sim-status-msg" class="sim-status">Ready</span>
        </div>
      </div>
    </div>

    <div class="drawer-content">
      <!-- Pane 1: Live SystemVerilog Output -->
      <div id="pane-rtl" class="drawer-pane active">
        <pre><code id="sv-code-output" class="language-systemverilog">// Generating SystemVerilog...</code></pre>
      </div>

      <!-- Pane 2: Waveform Viewer -->
      <div id="pane-waveform" class="drawer-pane">
        <div id="waveform-container"></div>
      </div>
    </div>
  </footer>

  <script type="module" src="bundle.js"></script>
</body>
</html>
