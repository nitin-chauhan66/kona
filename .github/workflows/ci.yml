name: Kona CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck (@kona/core & @kona/web)
        run: npm run typecheck

      - name: Build packages & web bundle
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: kona-build-artifacts
          retention-days: 5
          path: |
            packages/core/dist
            apps/web/public/bundle.js
            apps/web/public/bundle.js.map

  unit-and-e2e-tests:
    name: Unit & E2E Tests
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: kona-build-artifacts

      - name: Start web server & run Node/DOM/E2E test suite
        run: |
          node apps/web/server.mjs &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.5
          done

          node --test $(ls tests/*.test.mjs | grep -v 'verilator-yosys.test.mjs')

  rtl-eda-verification:
    name: Hardware EDA Lint & Synthesis (Verilator + Yosys)
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Verilator & Yosys EDA toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends verilator yosys

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: kona-build-artifacts

      - name: Run Verilator lint & Yosys synthesis verification
        run: node --test tests/verilator-yosys.test.mjs

      - name: Upload generated RTL test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: rtl-eda-failure-artifacts
          retention-days: 5
          path: .kona-test-artifacts

  docker-image:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs:
      - unit-and-e2e-tests
      - rtl-eda-verification
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Kona Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
